name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.17.1
  # Every push to main becomes release v0.1.<run number>. Old releases are kept: GitHub counts downloads per
  # release asset, and deleting a release would discard its count.
  VERSION: 0.1.${{ github.run_number }}

jobs:
  macos:
    runs-on: macos-15 # Apple Silicon
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Unit tests and scripted playthroughs
        run: zig build test --summary all
      - name: Stamp version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" -c "Set :CFBundleVersion ${{ github.run_number }}" res/Info.plist
      - name: Build app bundle
        run: zig build -Doptimize=ReleaseFast
      - name: Check the release binary
        run: |
          zig-out/bin/dentro --selftest
          codesign --verify --strict "zig-out/Dentro del cuerpo.app"
          otool -l zig-out/bin/dentro | grep -A3 LC_BUILD_VERSION | grep -q 'minos 14.0'
      - name: Package
        run: ditto -c -k --keepParent "zig-out/Dentro del cuerpo.app" Dentro-del-cuerpo-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: Dentro-del-cuerpo-macos-arm64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Dentro del cuerpo $VERSION (alpha)" \
            --generate-notes \
            --notes "Built from ${GITHUB_SHA::7}. Installation: https://github.com/$GITHUB_REPOSITORY#installation"
