# TEMPORARY: renders one frame with variants of the shader to find a difference in cell borders. To be removed.
name: exp
on:
  push:
    branches: [windows-port]
    paths: [".github/workflows/exp.yml", ".github/exp/**"]
jobs:
  borders:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      EXE: zig-out/Dentro del cuerpo/Dentro del cuerpo.exe
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build -Doptimize=ReleaseFast
      - run: |
          for v in A B D E; do
            python .github/exp/variant.py src/shaders/shaders.hlsl "zig-out/Dentro del cuerpo/shaders/shaders.hlsl" $v
            DENTRO_GPU_LOG=1 "$EXE" --software --chapter 2 --lang uk --shots out/$v 2>&1 | grep -v '^wrote ' || true
            mkdir -p keep
            cp out/$v/*g_scan.bmp keep/$v.bmp
            rm -r out/$v
          done
      - shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Get-ChildItem keep -Filter *.bmp | ForEach-Object {
            $image = [System.Drawing.Image]::FromFile($_.FullName)
            $image.Save(($_.FullName -replace '\.bmp$', '.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $image.Dispose()
            Remove-Item $_.FullName
          }
      - uses: actions/upload-artifact@v7
        with:
          name: exp-borders
          path: keep
          retention-days: 1
